KasjerzyIdQuery:
  name: id
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for id.

KasjerzyNazwiskoQuery:
  name: nazwisko
  in: query
  required: false
  schema:
    type: string
  description: Text filter for cashier name (supports ~ wildcard).

KasjerzyKodKasjeraQuery:
  name: kod_kasjera
  in: query
  required: false
  schema:
    type: string
  description: Text filter for cashier card number.

KasjerzyAktywnyQuery:
  name: aktywny
  in: query
  required: false
  schema:
    type: boolean
  description: Active flag filter.
