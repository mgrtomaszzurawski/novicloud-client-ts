FormyPlatnIdQuery:
  name: id
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for id.

FormyPlatnNazwaQuery:
  name: nazwa
  in: query
  required: false
  schema:
    type: string
  description: Text filter for payment method name.

FormyPlatnTypQuery:
  name: typ
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for payment type (0=cash, 1=credit card, 2=debit card, 3=check, 4=voucher, 5=transfer, 6=other).
