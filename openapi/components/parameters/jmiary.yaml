JmiaryIdQuery:
  name: id
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for id.

JmiaryNazwaQuery:
  name: nazwa
  in: query
  required: false
  schema:
    type: string
  description: Text filter for unit of measure name (supports ~ wildcard).

JmiaryPrecyzjaQuery:
  name: precyzja
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for precision level.
