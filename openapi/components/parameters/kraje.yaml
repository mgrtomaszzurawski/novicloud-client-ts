KrajeIdQuery:
  name: id
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for id.

KrajeNazwaQuery:
  name: nazwa
  in: query
  required: false
  schema:
    type: string
  description: Text filter for country name (supports ~ wildcard).

KrajeKodQuery:
  name: kod
  in: query
  required: false
  schema:
    type: string
  description: Text filter for country code.

KrajeWalutaIdQuery:
  name: waluta.id
  in: query
  required: false
  schema:
    type: string
  description: List or range filter on linked currency id.
