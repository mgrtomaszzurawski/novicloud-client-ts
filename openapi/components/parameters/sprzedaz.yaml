SprzedazIdQuery:
  name: id
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for id.

SprzedazDataQuery:
  name: data
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for sale date (e.g. min2017-05-20, max2017-05-25T23:59:59).

SprzedazNrDokQuery:
  name: nr_dok
  in: query
  required: false
  schema:
    type: string
  description: Text filter for document name (supports ~ wildcard).

SprzedazTypDokQuery:
  name: typ_dok
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for document type.

SprzedazNrSystemowyQuery:
  name: nr_systemowy
  in: query
  required: false
  schema:
    type: string
  description: Text filter for system number from cash register.

SprzedazNrFiskalnyQuery:
  name: nr_fiskalny
  in: query
  required: false
  schema:
    type: string
  description: Text filter for fiscal number from cash register.

SprzedazNrRapDobQuery:
  name: nr_rap_dob
  in: query
  required: false
  schema:
    type: string
  description: Text filter for daily report number from cash register.

SprzedazIloscQuery:
  name: ilosc
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for quantity.

SprzedazCenaQuery:
  name: cena
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for sale price.

SprzedazCenaPrzedRabQuery:
