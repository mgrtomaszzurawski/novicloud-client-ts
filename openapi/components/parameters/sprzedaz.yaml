  in: query
  required: false
  schema:
    type: string
  description: List or range filter for price before discount.

SprzedazStawkaVatQuery:
  name: stawka_vat
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for VAT rate.

SprzedazBruttoQuery:
  name: brutto
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for gross value.

SprzedazPodatekQuery:
  name: podatek
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for tax value.

SprzedazRabatQuery:
  name: rabat
  in: query
  required: false
  schema:
    type: string
  description: List or range filter for discount value.

SprzedazTowarIdQuery:
  name: towar.id
  in: query
  required: false
