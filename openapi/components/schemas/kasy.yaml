Kasa:
  type: object
  description: Cash register resource.
  properties:
    id:
      type: integer
      format: int64
    nazwa:
      type: string
    numer:
      type: integer
      format: int32
    ecr:
      type: string
      description: Unique ECR device number.
    ostatnia_sync:
      type: string
      format: date-time
      description: Last successful sync date/time.
    ostatnia_sprzed:
      type: string
      format: date-time
      description: Last sale date/time registered in the cloud database.
    aktywny:
      type: boolean
