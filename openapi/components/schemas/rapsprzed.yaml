    forma_platn:
      $ref: './common.yaml#/Link'
    ilosc:
      type: number
      format: double
    sprz_netto:
      type: number
      format: double
    sprz_brutto:
      type: number
      format: double
    sprz_zak_netto:
      type: number
      format: double
    sprz_zak_brutto:
      type: number
      format: double
    marza_netto:
      type: number
      format: double
    marza_brutto:
      type: number
      format: double
    marza_proc_netto:
      type: number
      format: double
    marza_proc_brutto:
      type: number
      format: double
    narzut_proc_netto:
      type: number
      format: double
    narzut_proc_brutto:
      type: number
      format: double
    rabat:
      type: number
      format: double
    rabat_proc:
      type: number
      format: double
