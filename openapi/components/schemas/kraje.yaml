Kraj:
  type: object
  description: Country resource.
  required:
    - nazwa
    - kod
  properties:
    id:
      type: integer
      format: int64
    nazwa:
      type: string
    kod:
      type: string
    waluta:
      $ref: './common.yaml#/Link'
