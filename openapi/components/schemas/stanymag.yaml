StanMag:
  type: object
  description: Inventory stock level resource (product-shop pair).
  properties:
    towar:
      $ref: './common.yaml#/Link'
    sklep:
      $ref: './common.yaml#/Link'
    ilosc:
      type: number
      format: double
    w_c_zak_netto:
      type: number
      format: double
      description: Stock value at net purchase price (requires warehouse management option).
    w_c_zak_brutto:
      type: number
      format: double
      description: Stock value at gross purchase price (requires warehouse management option).
    w_c_sprzed_netto:
      type: number
      format: double
      description: Stock value at net selling price (requires warehouse management option).
    w_c_sprzed_brutto:
      type: number
      format: double
      description: Stock value at gross selling price (requires warehouse management option).
