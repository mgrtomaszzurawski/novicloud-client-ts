Waluta:
  type: object
  description: Currency resource.
  required:
    - nazwa
    - kod
  properties:
    id:
      type: integer
      format: int64
    nazwa:
      type: string
    kod:
      type: string
    kurs:
      type: number
      format: double
      description: Current exchange rate in the default currency.
    domyslna:
      type: boolean
      description: True if this is the default currency.
    aktywny:
      type: boolean
