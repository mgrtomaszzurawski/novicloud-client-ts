Kontrahent:
  type: object
  description: Counterparty resource.
  required:
    - nazwa
  properties:
    id:
      type: integer
      format: int64
    nazwa:
      type: string
    nip:
      type: string
    skrot:
      type: string
    ulica:
      type: string
    nr_domu:
      type: string
    nr_lokalu:
      type: string
    ulica_i_numer:
      type: string
      description: Combined street and number (read-only).
    kod_poczt:
      type: string
    poczta:
      type: string
    miasto:
      type: string
    gmina:
      type: string
    powiat:
      type: string
    wojewodztwo:
      type: string
    kraj:
      $ref: './common.yaml#/Link'
    telefon:
      type: string
    email:
      type: string
    aktywny:
      type: boolean
    dostawca:
      type: boolean
    staly:
      type: boolean
    producent:
      type: boolean
    odbiorca:
      type: boolean
    osoba:
      type: boolean
