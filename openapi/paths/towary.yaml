towaryCollection:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
  get:
    summary: List products
    operationId: listTowary
    tags:
      - Towary
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/StartQuery'
      - $ref: '../openapi.yaml#/components/parameters/ContentQuery'
      - $ref: '../openapi.yaml#/components/parameters/FtsQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryIdQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryNazwaQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryKodQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryStawkaVatQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryAkcyzowyQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryTypQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryCenaDetQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryJmIdQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryAsortIdQuery'
      - $ref: '../openapi.yaml#/components/parameters/TowaryAktywnyQuery'
    responses:
      '200':
        description: Product collection response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseTowaryList'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '410':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '501':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  post:
    summary: Create product
    operationId: createTowar
    tags:
      - Towary
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Towar'
    responses:
      '201':
        description: Resource created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseCreated'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '410':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '501':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  put:
    summary: Update product (id in body)
    operationId: updateTowary
    tags:
      - Towary
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Towar'
    responses:
      '200':
        description: Success response with no data payload.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseEmpty'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '410':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '501':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'

