jmiaraCollection:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
  get:
    summary: List units of measure
    operationId: listJmiary
    tags:
      - Jmiary
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/StartQuery'
      - $ref: '../openapi.yaml#/components/parameters/ContentQuery'
      - $ref: '../openapi.yaml#/components/parameters/FtsQuery'
      - $ref: '../openapi.yaml#/components/parameters/JmiaryIdQuery'
      - $ref: '../openapi.yaml#/components/parameters/JmiaryNazwaQuery'
      - $ref: '../openapi.yaml#/components/parameters/JmiaryPrecyzjaQuery'
    responses:
      '200':
        description: Unit of measure collection response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseJmiaryList'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  post:
    summary: Create unit of measure
    operationId: createJmiary
    tags:
      - Jmiary
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Jmiary'
    responses:
      '201':
        description: Resource created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseCreated'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  put:
    summary: Update unit of measure (id in body)
    operationId: updateJmiary
    tags:
      - Jmiary
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Jmiary'
    responses:
      '200':
        description: Success response with no data payload.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseEmpty'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'

jmiaraById:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
    - $ref: '../openapi.yaml#/components/parameters/IdPath'
  get:
    summary: Get unit of measure by id
    operationId: getJmiaryById
    tags:
      - Jmiary
    responses:
      '200':
        description: Single unit of measure response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseJmiary'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  put:
    summary: Update unit of measure by id
    operationId: updateJmiaryById
    tags:
      - Jmiary
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Jmiary'
    responses:
      '200':
        description: Success response with no data payload.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseEmpty'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  delete:
    summary: Delete unit of measure by id
    operationId: deleteJmiary
    tags:
      - Jmiary
    responses:
      '200':
        description: Success response with no data payload.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseEmpty'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
