kasjerCollection:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
  get:
    summary: List cashiers
    operationId: listKasjerzy
    tags:
      - Kasjerzy
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/StartQuery'
      - $ref: '../openapi.yaml#/components/parameters/ContentQuery'
      - $ref: '../openapi.yaml#/components/parameters/FtsQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasjerzyIdQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasjerzyNazwiskoQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasjerzyKodKasjeraQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasjerzyAktywnyQuery'
    responses:
      '200':
        description: Cashier collection response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseKasjerzyList'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'

kasjerById:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
    - $ref: '../openapi.yaml#/components/parameters/IdPath'
  get:
    summary: Get cashier by id
    operationId: getKasjerById
    tags:
      - Kasjerzy
    responses:
      '200':
        description: Single cashier response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseKasjer'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
