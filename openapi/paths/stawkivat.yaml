stawkaVatCollection:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
  get:
    summary: List VAT rates
    operationId: listStawkiVat
    tags:
      - StawkiVat
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/StartQuery'
      - $ref: '../openapi.yaml#/components/parameters/ContentQuery'
      - $ref: '../openapi.yaml#/components/parameters/StawkiVatIdQuery'
    responses:
      '200':
        description: VAT rate collection response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseStawkiVatList'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  post:
    summary: Create VAT rate
    operationId: createStawkaVat
    tags:
      - StawkiVat
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/StawkaVat'
    responses:
      '201':
        description: Resource created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseCreated'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  put:
    summary: Update VAT rate (id in body)
    operationId: updateStawkiVat
    tags:
      - StawkiVat
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/StawkaVat'
    responses:
      '200':
        description: Success response with no data payload.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseEmpty'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'

