kasaCollection:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
  get:
    summary: List cash registers
    operationId: listKasy
    tags:
      - Kasy
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/StartQuery'
      - $ref: '../openapi.yaml#/components/parameters/ContentQuery'
      - $ref: '../openapi.yaml#/components/parameters/FtsQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasyIdQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasyNazwaQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasyNumerQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasyEcrQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasyOstatniaSyncQuery'
      - $ref: '../openapi.yaml#/components/parameters/KasyAktywnyQuery'
    responses:
      '200':
        description: Cash register collection response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseKasyList'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'

kasaById:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
    - $ref: '../openapi.yaml#/components/parameters/IdPath'
  get:
    summary: Get cash register by id
    operationId: getKasaById
    tags:
      - Kasy
    responses:
      '200':
        description: Single cash register response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseKasa'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
