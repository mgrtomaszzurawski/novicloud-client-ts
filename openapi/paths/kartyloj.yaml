kartaLojCollection:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
  get:
    summary: List loyalty cards
    operationId: listKartyLoj
    tags:
      - KartyLoj
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/StartQuery'
      - $ref: '../openapi.yaml#/components/parameters/ContentQuery'
      - $ref: '../openapi.yaml#/components/parameters/FtsQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojKodQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojNazwiskoImieQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojPosiadaczQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojTelefonQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojEmailQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojWaznaOdQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojWaznaDoQuery'
      - $ref: '../openapi.yaml#/components/parameters/KartyLojUniewaznionoQuery'
    responses:
      '200':
        description: Loyalty card collection response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseKartyLojList'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  post:
    summary: Create loyalty card
    operationId: createKartaLoj
    tags:
      - KartyLoj
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/KartaLojalnosciowa'
    responses:
      '201':
        description: Resource created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseCreated'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  put:
    summary: Update loyalty card (kod in body)
    operationId: updateKartyLoj
    tags:
      - KartyLoj
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/KartaLojalnosciowa'
    responses:
      '200':
        description: Success response with no data payload.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseEmpty'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'

kartaLojByKod:
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/AccountNamePath'
    - $ref: '../openapi.yaml#/components/parameters/KartyLojKodPath'
  get:
    summary: Get loyalty card by kod
    operationId: getKartaLojByKod
    tags:
      - KartyLoj
    responses:
      '200':
        description: Single loyalty card response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseKartaLoj'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
  put:
    summary: Update loyalty card by kod
    operationId: updateKartaLojByKod
    tags:
      - KartyLoj
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/KartaLojalnosciowa'
    responses:
      '200':
        description: Success response with no data payload.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/ApiResponseEmpty'
      '400':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '401':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '402':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
      '500':
        $ref: '../components/schemas/envelopes.yaml#/ApiResponseError'
